# kaz 预设（Kaz 8.0 试验）——《Kaz8.0设计.md》的落地组合。
#
# 工具面原则（2026-09-12 定）：与官方标准预设对齐，只靠黑名单控制角色可见性；
# 只有"我们永久替代掉的"才不挂（官方 subagent / subagent_fork → ka_sub_whale）。
#   * persona 行给短兜底文本；真实主代理 persona 由 ./kaz-system-prompt.mjs
#     从 functions/kaz-shared 注入（单一事实源）。
#   * 系统提示面：只摘掉平台默认的 harness:identity 段（避免看起来像标准模式）；
#     平台的工具指引、环境说明等段落保留。
#   * 未挂（替代品或按决定不挂）：官方 subagent / subagent_fork、tool-bash、
#     command-goal + tool-goal、plan-mode（/plan）、tool-workflow + workflow-worker-thread、tool-ralph。
#   * kaz-shared 的工具面门：主代理黑名单（注册表收紧 + assemble 期过滤工具表）。
#   * compaction 组带 isolate（compaction + toolResultPruner realm）：内置压缩 provider、
#     上下文三件与官方压缩配套同组，组内才能解析到同一个 ctx.compaction / ctx.tokenMeter。

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    prefix: "We are the user's point of contact and the work's arranger."

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

- id: kaz-system-prompt
  name: ./kaz-system-prompt.mjs

- id: kaz-shared
  name: ./functions/kaz-shared/lib/index.js

# ── environment 记忆注入（persona 之下、官方工具提示之上；只给主代理）──────────
- id: kaz-environment
  name: ./functions/kaz-environment/lib/index.js

- id: ka-whale-memory
  name: ./functions/ka-whale-memory/lib/index.js

- id: ka-whale-workflow
  name: ./functions/ka-whale-workflow/lib/index.js

# ── shell / 文件系统 ────────────────────────────────────────────────────────
- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

# ── 后台作业（官方配套：run_in_background 的回收工具）────────────────────────
- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'

# ── 技能 ────────────────────────────────────────────────────────────────────
- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

# ── 其余模型面对工具 ─────────────────────────────────────────────────────────
- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: true
    searchTimeoutMs: 60000

- id: present
  name: '@deepseek-ai/dsh-tool-present'

# ── 子代理控制（list_agents / send_message / interrupt_agent）────────────────
- id: tool-subagent-control
  name: '@deepseek-ai/dsh-tool-subagent-control'

- id: tool-subagent-list-agents
  name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'

# ── compaction 组：内置压缩 + 上下文三件 + 官方压缩配套 ──────────────────────
- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    - id: kaz-context-policy
      name: ./functions/kaz-context-policy/lib/index.js

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024
