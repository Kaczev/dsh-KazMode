# kaz 预设（Kaz 8.0 试验）——《Kaz8.0设计.md》的落地组合。
#
# 当前阶段：功能 1（persona 层）+ 最小载体。
#   * persona 行给短兜底文本；真实主代理 persona 由 ./kaz-system-prompt.mjs
#     从 functions/kaz-shared 注入（单一事实源）。
#   * 系统提示面：只摘掉平台默认的 harness:identity 段（避免看起来像标准模式）；
#     平台的工具指引、环境说明等段落保留。
#   * 只挂现在就需要、且已存在的行；工作流工具按功能逐个加入。
#   * kaz-shared 的工具面门：主代理黑名单（注册表收紧 + assemble 期过滤工具表）。
#   * compaction 组带 isolate（compaction realm）：内置压缩 provider 与上下文三件同组，
#     组内才能解析到同一个 ctx.compaction / ctx.tokenMeter。

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    prefix: "We are the user's point of contact and the work's arranger."

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

- id: kaz-system-prompt
  name: ./kaz-system-prompt.mjs

- id: kaz-shared
  name: ./functions/kaz-shared/lib/index.js

- id: ka-whale-memory
  name: ./functions/ka-whale-memory/lib/index.js

- id: ka-whale-workflow
  name: ./functions/ka-whale-workflow/lib/index.js

# ── shell / 文件系统 ────────────────────────────────────────────────────────
- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

# ── 其余模型面对工具 ─────────────────────────────────────────────────────────
- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'

# ── 子代理控制（list_agents / send_message / interrupt_agent）────────────────
- id: tool-subagent-control
  name: '@deepseek-ai/dsh-tool-subagent-control'

- id: tool-subagent-list-agents
  name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'

# ── compaction 组：内置压缩 provider + 上下文三件（同组共享 compaction realm）──
- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    - id: kaz-context-policy
      name: ./functions/kaz-context-policy/lib/index.js

