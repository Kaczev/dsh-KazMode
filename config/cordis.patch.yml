# kaz-memory: 独立记忆插件（vendored @max-null/dsh-memory 引擎，MIT）。
# 与旧组件同功能（四工具 + 明文存储），但不做上下文注入（无 memory:recall），
# 模型靠固定指引 + 主动 memory_search 获取记忆；客户端半提供头部「记忆」按钮
# 与待确认面板（人工确认闸门 UI，经 kaz-memory settings 命名空间桥接）。
- insert:
    - id: memory
      name: kaz-memory

# Your patch layer for this dsh profile, applied after every bundle layer:
# a top-level YAML array of loader patch entries (id-targeted config
# overrides, disables, and insert lists; `!!js` expressions allowed).

# thinking-anchor: appends a one-time English-reasoning instruction to the
# system prompt of each NEW conversation (first request only). Disable without
# removing the row by setting `enabled: false` in the `thinking-anchor:`
# section of $DSH_HOME/settings.yaml (hot-reloaded).
- insert:
    - id: thinking-anchor
      name: thinking-anchor
      config:
        enabled: true

# tool-filter: filters specified tools out of the tool surface. Two modes:
#   remove  (default) - blocked tools never register / are never visible;
#   disable          - blocked tools stay listed but every call is refused.
# Live config lives in the `tool-filter:` section of $DSH_HOME/settings.yaml
# (hot-reloaded); the row below is the base layer.
- insert:
    - id: tool-filter
      name: tool-filter
      config:
        enabled: true
        mode: remove
        disabledTools:
          - tool-cordis
          - tool-subagent-report
          - codex
          - claude-code

# tool-grouping: regroups tools into named groups/realms at runtime — the
# tool-fs group (read/write/edit/glob/grep + str_replace_editor) and the
# workflowEngine group (workflow/ralph with the workflow worker); every other
# tool stays in the default group. Non-breaking: tagging only (mode: tag) or
# trace logging (mode: trace), never blocks calls. Live config lives in the
# `tool-grouping:` section of $DSH_HOME/settings.yaml (hot-reloaded); the row
# below is the base layer.
- insert:
    - id: tool-grouping
      name: tool-grouping
      config:
        enabled: true

# round-minimal: switches the tool surface and prompt policy by conversation
# round. Round 1 (first request) is minimal mode: a system-prompt section tells
# the model that round 1 is only for understanding the task (fewer tools;
# full tools from round 2), and only firstRoundTools (default pwsh,
# str_replace_editor) stay visible and callable. From round 2 on, all
# configured tools are restored and the instruction stops.
# Subagents are excluded by default (includeSubagents: false). Live config
# lives in the round-minimal: section of DSH_HOME/settings.yaml (hot-reloaded);
# the row below is the base layer.
- insert:
    - id: round-minimal
      name: round-minimal
      config:
        enabled: true

# kaz-mode: 超级模式插件。Web UI 右上角「Kaz 模式」开关 + 集中管理面板，
# 一键联动管理 thinking-anchor / round-minimal / tool-grouping / tool-filter /
# code-collapse 五个插件（开启时自动启用、关闭时恢复原始状态），并在对话首轮
# 于输入框上方显示任务目标提示（仅 UI 显示，不注入模型提示词）。工具分组数据
# 完全来自 tool-grouping 插件的 toolGrouping 运行时服务，kaz-mode 不内置工具列表。
# 实时配置见 settings.yaml 的 kaz-mode: 段（热重载）。
- insert:
    - id: kaz-mode
      name: kaz-mode
      config:
        enabled: false

# code-collapse: 工具塌缩插件。对每个会话声明 Code Mode 呈现（presentAs('code')），
# 工具面折叠为唯一入口 run_code（附生成 TS SDK 提示）；每次 run_code 调用完成后
# 向对话追加一条 We need 推理风格提醒（双语信封，callHint 可配）。Kaz 模式把它
# 作为第 5 个被管理插件（默认启用、可关）；也可独立使用。实时配置见
# settings.yaml 的 code-collapse: 段（热重载）。
- insert:
    - id: code-collapse
      name: code-collapse
      config:
        enabled: false

# output-beep: 模型输出完毕提示音插件。监听 agent/status，agent 回到 idle
# （= 模型输出完毕）时播放一次 Windows 提示音（[console]::beep，频率/时长可配）。
# Kaz 模式把它作为第 6 个被管理插件（Kaz 面板开关行；进入 Kaz 联动启用、关闭
# Kaz 保持当前状态）；也可独立安装使用，与 Kaz 模式解耦。实时配置见 settings.yaml
# 的 output-beep: 段（热重载）。
- insert:
    - id: output-beep
      name: output-beep
      config:
        enabled: true
# round-display: 每轮注入显示插件（Kaz 模式附属）——只负责显示：监听
# system-prompt/assemble 瀑布被动捕获已知插件段 + 发布 roundDisplay.report 服务
# 供其它要发送信息的插件主动上报（best-effort），按 agent × 轮次存档；客户端在
# 对话输入区右侧提供「本轮注入」按钮与面板（[插件]>内容< 格式），经专用 RPC
# 通道（/round-display，loopback）读取。实时配置见 settings.yaml 的 round-display:
# 段（热重载）。
- insert:
    - id: round-display
      name: round-display
      config:
        enabled: true

# task-master-whiteboard: Task Master 白板插件。注入 Task Master 角色提示段 +
# 6 个白板工具（new/list/read/append/update/clear_whiteboard）；白板存
# <工作区>/.dsh/whiteboards/。Kaz 模式的第 7 个被管理插件（Kaz 面板开关行）；
# 也可独立安装使用，与 Kaz 模式解耦。实时配置见 settings.yaml 的
# task-master-whiteboard: 段（热重载）。
- insert:
    - id: task-master-whiteboard
      name: task-master-whiteboard
      config:
        enabled: true

